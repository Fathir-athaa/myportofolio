<div id="add-organization-modal" class="project-form-modal" popover="auto"
      role="dialog" aria-modal="true" aria-labelledby="add-organization-modal-title">
  <button type="button" class="project-form-modal__backdrop"
          popovertarget="add-organization-modal" popovertargetaction="hide"
          aria-label="Tutup form"></button>
  <div class="project-form-modal__content">
    <button type="button" class="project-form-modal__close"
            popovertarget="add-organization-modal" popovertargetaction="hide"
            aria-label="Tutup form">&times;</button>
    <h2 id="add-organization-modal-title">Tambah Organization Baru</h2>
    <form id="organization-form" method="post"
          action="{% url 'main:add_organization' %}" class="project-form">
      {% csrf_token %}
      {% for field in form %}
      <div class="form-group">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% for error in field.errors %}
        <p class="form-error">{{ error }}</p>
        {% endfor %}
      </div>
      {% endfor %}
      <div class="project-form-modal__actions">
        <button type="button" class="button button-secondary"
                popovertarget="add-organization-modal" popovertargetaction="hide">Batal</button>
        <button type="submit" class="button">Tambah Organization</button>
      </div>
    </form>
  </div>
</div>
