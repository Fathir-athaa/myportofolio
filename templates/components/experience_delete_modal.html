<p class="experience-status" style="background:transparent;border:none;padding:0;">
  <button type="button"
          class="button button-danger"
          popovertarget="delete-experience-{{ experience.id }}"
          aria-label="Hapus {{ experience.title }}">
    Hapus
  </button>
</p>

<div id="delete-experience-{{ experience.id }}"
      class="project-delete-modal"
      popover="auto"
      role="dialog"
      aria-modal="true">
  <button type="button"
          class="project-delete-modal__backdrop"
          popovertarget="delete-experience-{{ experience.id }}"
          popovertargetaction="hide"
          aria-label="Tutup"></button>
  <div class="project-delete-modal__content">
    <button type="button"
            class="project-delete-modal__close"
            popovertarget="delete-experience-{{ experience.id }}"
            popovertargetaction="hide">×</button>
    <h2>Hapus Experience?</h2>
    <p>Yakin ingin menghapus <strong>{{ experience.title }}</strong>?</p>
    <div class="project-delete-modal__actions">
      <button type="button" class="button button-secondary"
              popovertarget="delete-experience-{{ experience.id }}"
              popovertargetaction="hide">Batal</button>
      <form method="post" action="{% url 'main:delete_experience' experience.id %}">
        {% csrf_token %}
        <button type="submit" class="button button-danger">Ya, Hapus</button>
      </form>
    </div>
  </div>
</div>
